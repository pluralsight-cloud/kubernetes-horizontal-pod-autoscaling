apiVersion: apps/v1
kind: Deployment
metadata:
  name: globomantics
  labels:
    app: globomantics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: globomantics
  template:
    metadata:
      labels:
        app: globomantics
    spec:
      containers:
        - name: globomantics
          image: globomantics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
